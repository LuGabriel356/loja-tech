<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block titulo %}
        TechMais
        {% endblock %}
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/static/style.css" rel="stylesheet" />
</head>

<body>
    <header class="bg-dark text-light techmais-body">
        <nav class="menu navbar navbar-expand navbar-dark techmais-navbar px-3 px-md-4 py-3">
            <div
                class="container d-flex flex-wrap align-items-center justify-content-center justify-content-md-start gap-2 gap-md-3">
                <h1>TechMais</h1>
                <a class="nav-link techmais-nav-link" href="{{ url_for('dashboard') }}">Dashboard</a>
                <a class="nav-link techmais-nav-link" href="{{ url_for('listar_usuarios') }}">Usuários</a>
                <a class="nav-link techmais-nav-link" href="{{ url_for('listar_produtos') }}">Peças</a>
                <a class="nav-link techmais-nav-link" href="{{ url_for('inicio') }}">Login</a>
            </div>
        </nav>
    </header>

    <main class="container d-flex justify-content-center">
        {% for tipo, mensagem in get_flashed_messages(with_categories=true) %}
        <div class="alert alert-{{ tipo }} alert-dismissible fade show" role="alert">
            {{ mensagem }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
        </div>
        {% endfor %}

        {% block conteudo %}

        {% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
