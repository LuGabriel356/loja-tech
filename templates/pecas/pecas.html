{% extends 'layout/base_menu.html' %}

{% block titulo %} Listar peças {% endblock %}

{% block conteudo %}

<main class="pagina container py-4 py-md-5 pagina-estilizada">
    <article class="card techmais-card shadow-lg border-0">
        <div class="card-body p-3 p-md-4 p-lg-5">
            <h1 class="display-6 fw-bold mb-4 techmais-title">Listagem de Peças de Informática</h1>
            <a class="botao-azul btn btn-primary techmais-button me-2 mb-2" href="/pecas/cadastrar">ADICIONAR
                PEÇA</a>
            <section class="table-responsive rounded-3 border border-secondary-subtle mt-4">
                <table class="table table-dark table-striped table-hover align-middle mb-0 techmais-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Peça</th>
                            <th>Categoria</th>
                            <th>Preço</th>
                            <th>Estoque</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>Teclado USB</td>
                            <td>Periféricos</td>
                            <td>R$ 79,90</td>
                            <td>12</td>
                            <td><a class="link-info link-underline-opacity-0 link-underline-opacity-100-hover"
                                    href="/pecas/cadastrar">Editar</a></td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td>Mouse Gamer</td>
                            <td>Periféricos</td>
                            <td>R$ 99,90</td>
                            <td>8</td>
                            <td><a class="link-info link-underline-opacity-0 link-underline-opacity-100-hover"
                                    href="/pecas/cadastrar">Editar</a></td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </div>
    </article>
</main>

{% endblock %}
