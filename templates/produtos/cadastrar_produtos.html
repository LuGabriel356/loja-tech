{% extends 'layout/base_menu.html' %}

{% block titulo %} Cadastrar peças {% endblock %}

{% block conteudo %}

<main class="pagina container py-4 py-md-5 pagina-estilizada">
    <article class="card techmais-card shadow-lg border-0">
        <div class="card-body p-3 p-md-4 p-lg-5">
            <h1 class="display-6 fw-bold mb-4 techmais-title">Cadastro de Peças</h1>
            <form action="/produtos/cadastrar" class="techmais-form" method="get">
                <label class="form-label mt-2 mb-1">Nome da peça:</label><input
                    class="form-control mb-3 techmais-control" name="nome" />
                <label class="form-label mt-2 mb-1">Categoria:</label><select class="form-select mb-3 techmais-control"
                    name="categoria">
                    <option>Processador</option>
                    <option>Memória RAM</option>
                    <option>Placa de vídeo</option>
                    <option>Armazenamento</option>
                    <option>Periféricos</option>
                    <option>Outros</option>
                </select>
                <label class="form-label mt-2 mb-1">Preço:</label><input class="form-control mb-3 techmais-control"
                    name="preco" step="0.01" type="number" />
                <label class="form-label mt-2 mb-1">Quantidade em estoque:</label><input
                    class="form-control mb-3 techmais-control" name="estoque" type="number" />
                <label class="form-label mt-2 mb-1">Marca:</label><input class="form-control mb-3 techmais-control"
                    name="marca" />
                <button class="botao-azul btn btn-primary techmais-button me-2 mb-2" type="submit">Salvar</button>
                <a class="botao-azul btn btn-primary techmais-button me-2 mb-2 techmais-back-link"
                    href="{{ url_for('listar_produtos') }}">Voltar</a>
            </form>
        </div>
    </article>
</main>

{% endblock %}
