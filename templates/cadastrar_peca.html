<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Peças - TechMais</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet" />
</head>

<body class="bg-dark text-light techmais-body">
    <div class="menu navbar navbar-expand navbar-dark techmais-navbar px-3 px-md-4 py-3">
        <div
            class="container d-flex flex-wrap align-items-center justify-content-center justify-content-md-start gap-2 gap-md-3">
            <a class="nav-link techmais-nav-link navbar-brand fw-bold me-md-3" href="/">TechMais</a>
            <a class="nav-link techmais-nav-link" href="/usuarios">Usuários</a>
            <a class="nav-link techmais-nav-link" href="/pecas">Peças</a>
            <a class="nav-link techmais-nav-link" href="/vendas">Vendas</a>
            <a class="nav-link techmais-nav-link" href="/login">Login</a>
        </div>
    </div>
    <div class="pagina container py-4 py-md-5 pagina-estilizada">
        <div class="card techmais-card shadow-lg border-0">
            <div class="card-body p-3 p-md-4 p-lg-5">
                <h1 class="display-6 fw-bold mb-4 techmais-title">Cadastro de Peças</h1>
                <form action="/pecas/cadastrar" class="techmais-form" method="get">
                    <label class="form-label mt-2 mb-1">Nome da peça:</label><input
                        class="form-control mb-3 techmais-control" name="nome" />
                    <label class="form-label mt-2 mb-1">Categoria:</label><select
                        class="form-select mb-3 techmais-control" name="categoria">
                        <option>Processador</option>
                        <option>Memória RAM</option>
                        <option>Placa de vídeo</option>
                        <option>Armazenamento</option>
                        <option>Periféricos</option>
                        <option>Outros</option>
                    </select>
                    <label class="form-label mt-2 mb-1">Preço:</label><input class="form-control mb-3 techmais-control"
                        name="preco" step="0.01" type="number" />
                    <label class="form-label mt-2 mb-1">Quantidade em estoque:</label><input
                        class="form-control mb-3 techmais-control" name="estoque" type="number" />
                    <label class="form-label mt-2 mb-1">Marca:</label><input class="form-control mb-3 techmais-control"
                        name="marca" />
                    <button class="botao-azul btn btn-primary techmais-button me-2 mb-2" type="submit">Salvar</button>
                    <a class="botao-azul btn btn-primary techmais-button me-2 mb-2 techmais-back-link"
                        href="/pecas">Voltar</a>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
